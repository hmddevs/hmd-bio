name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the tree. It never needs to write to the repo,
# comment on a PR, or touch packages, so the token is scoped down to match.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Runs even when lint fails, so a PR gets both sets of errors at once
      # rather than one round trip per check. It is gated on the install having
      # succeeded: typechecking a tree with no node_modules reports every import
      # in the repo as a missing module, which buries the real failure.
      - name: Typecheck
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: npx tsc --noEmit
